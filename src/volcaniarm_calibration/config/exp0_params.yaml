# Experiment 0 (robot characterization) headless run modes.
# Run:  ros2 run volcaniarm_calibration accuracy_test --ros-args \
#           --params-file <path-to>/exp0_params.yaml -p test_type:=<mode> [...]
# Every value here overrides accuracy_test_params.yaml defaults; anything
# not listed keeps its default. [FILL] values come from the Exp0 protocol
# (task rectangle from the optimization tool; joint limit from the
# hardware measurement, protocol item 6b).

accuracy_test_node:
  ros__parameters:
    # ---- shared -------------------------------------------------
    initial_y: 0.0
    initial_z: 0.6
    settle_time: 2.0            # replaced by the settle_probe result
    joint_limit_rad: 1.13       # [FILL] measured mechanical limit
    output_dir: ~/workspaces/volcaniarm_ws/experiments/data

    # ---- mode 1: noise gate (Day 0-1, blocking) -----------------
    # -p test_type:=noise_gate
    # ~5 poses spanning the task region; 500 samples each. Analysis:
    # per-axis sigma/bias + rolling-median effective noise vs the
    # 1-2 mm gate. Also decides single-sample vs median (open item 8).
    # goals: [0.0, 0.6,  -0.35, 0.6,  0.35, 0.6,  0.0, 0.5,  0.0, 0.8]
    # samples_per_capture: 500

    # ---- mode 2: settle probe (Day 1) ---------------------------
    # -p test_type:=settle_probe -p num_cycles:=3
    # settle_time is forced to 0 by the test; 120 samples ~ 4 s @30 Hz
    # trace pose vs t_ros_ns after arrival at each pose.
    # goals: [0.0, 0.6,  -0.3, 0.7,  0.3, 0.7,  0.0, 0.8]
    # samples_per_capture: 120

    # ---- mode 3: sweep (Days 2-3, one run per pass) -------------
    # -p test_type:=workspace_coverage -p num_cycles:=1 \
    # -p goals_source:=grid \
    # -p pass_id:=1     (pass 2: different day / power cycle, pass_id:=2)
    # Resume after an interruption: count target rows in the dead
    # run's fk_poses.csv and pass -p skip_visits:=<count> (same pass_id).
    # goals_source: grid
    # grid_y0: -0.40    # [FILL] task rectangle (locked)
    # grid_y1: 0.40
    # grid_z0: 0.55
    # grid_z1: 0.85
    # grid_spacing_m: 0.025
    # limit_margin_rad: 0.05
    # closure_margin_m: 0.02

    # ---- mode 4: accuracy + repeatability anchors (Day 4) -------
    # 9 anchor points of the task rectangle (4 corners + 4 edge mids +
    # center, inset one grid spacing), 30 cycles each -- ONE
    # repeatability run per point. Per ISO 9283 the same 30-visit
    # cluster yields both AP (accuracy: cluster mean vs commanded) and
    # RP (repeatability: cluster spread); enable the tag-verified home
    # gate (verify_home_with_tag) once the URDF apriltag mounts are
    # calibrated, or set home_tol_m above the known mount bias.
    # Print the points + ready-made commands:
    #   python3 -m volcaniarm_calibration.grid --y0 ... --z1 ... \
    #       --joint-limit <measured> --nine
    # Then per point:
    #   -p test_type:=repeatability -p num_cycles:=30 \
    #   -p goals:="[<y>, <z>]"
    # (backlash test remains available but is not scheduled)
