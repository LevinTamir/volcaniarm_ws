# Intrinsics for the Logitech UVC webcam used as the stand camera in
# tests mode (real_bringup camera:=usb / camera:=auto without a
# RealSense). UNCALIBRATED until the one-time procedure below is done —
# usb_cam will warn at startup and publish a zeroed camera_info, and
# AprilTag poses will be wrong, as long as this file has no data.
#
# One-time calibration (checkerboard, ~5 min):
#   1. Print a checkerboard (e.g. 8x6 inner corners, 25 mm squares) and
#      tape it to something flat.
#   2. Bring up the webcam alone:
#        ros2 run usb_cam usb_cam_node_exe --ros-args \
#            -p video_device:=/dev/video0 -p pixel_format:=mjpeg2rgb \
#            -p image_width:=1280 -p image_height:=720
#   3. Run the calibrator (size = INNER corners, square in metres):
#        ros2 run camera_calibration cameracalibrator \
#            --size 8x6 --square 0.025 \
#            --ros-args -r image:=/image_raw -r camera:=/
#      Move the board around until the X/Y/Size/Skew bars fill, click
#      CALIBRATE, then SAVE.
#   4. SAVE writes /tmp/calibrationdata.tar.gz; extract ost.yaml from it
#      and REPLACE this file's contents with that yaml (keep this header),
#      but set camera_name to "logitech" (must match the usb_cam
#      camera_name parameter in real_bringup).
#
# Redo only if the camera or its resolution changes (the intrinsics do
# not depend on where the camera stands — that part is handled by the
# dashboard's camera-localization flow).
