# Vision RL controller config — sibling of `volcaniarm_rl_controller.yaml`.
# Loaded into controller_manager so the operator can switch between
# the state-based and image-based policies at runtime.

controller_manager:
  ros__parameters:
    volcaniarm_rl_vision_controller:
      type: volcaniarm_controller/RLVisionPolicyController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


volcaniarm_rl_vision_controller:
  ros__parameters:
    # Same training contract as the state-based controller — joint
    # order matters for both obs and action vectors.
    joints:
      - volcaniarm_left_elbow_joint
      - volcaniarm_right_elbow_joint

    # Match Isaac Lab `init_state.joint_pos`.
    default_joint_positions: [0.0, 0.0]

    # Match training's JointPositionActionCfg(scale=0.5).
    action_scale: 0.5

    # Bundled ONNX (image + joint_pos_rel + last_action → action),
    # exported by source/volcaniarm/scripts/rsl_rl/export_onnx_bundle.py.
    model_path: "$(find-pkg-share volcaniarm_controllers)/models/policy_vision.onnx"

    # Camera image topic. Default matches both Gazebo's bridged
    # `/camera/color/image_raw` and the IsaacSim ROS2 USD's
    # `camera/color/image_raw` (CAM_RGB_TOPIC in scripts/add_ros2_graph.py).
    image_topic: /camera/color/image_raw

    # Resolution the bundled ONNX expects — must match CAM_H/CAM_W in
    # the isaaclab AME contract (reach_vision_ame/contract.py). The
    # controller resizes the raw camera frame to (image_width ×
    # image_height) before inference, so this stays fixed even if the
    # camera publishes a different native resolution.
    image_width: 96
    image_height: 96

    # -- Safety / polish (carried over from RLPolicyController) --
    # Order matches `joints` above: [left_elbow, right_elbow].
    #
    # +-1.3089969 rad = the envelope the policy trained in (set by the
    # `elbow_pos_in_range` reward term). This is the REAL-HARDWARE value:
    # a clamp tighter than training breaks reachability (history: +-1.0
    # silently cost roughly half the reachable Y span at canopy height);
    # a clamp wider than training lets the policy command poses it has
    # never seen. NOTE the clamp is NOT what limits side reach in normal
    # operation — the policy itself avoids leaving its trained envelope
    # (verified 2026-07-23: widening to +-2.71 changed nothing). The clamp
    # exists to catch malfunction, not to shape behavior. A second,
    # controller-independent backstop lives in the hardware interface
    # (xacro command_interface min/max, enforced in write()).
    joint_position_min: [-1.3089969, -1.3089969]
    joint_position_max: [1.3089969, 1.3089969]


    # EMA smoothing on raw policy outputs. 1.0 = no smoothing.
    # Lower values damp the high-frequency demands that exceed the
    # stepper's physical step rate (the sim-to-real gap that caused
    # the state-based policy to chase its own tail on first deploy).
    # 0.3 = 70% old / 30% new each tick.
    action_smoothing_alpha: 0.3

    # Stale-image watchdog. If the latest image stamp is older than
    # this many seconds the controller falls back to the home pose.
    # Skipped when stamp is zero (un-stamped publishers), same policy
    # as the state-based controller's stale-target watchdog.
    image_max_age_s: 1.0

    # -- REST/WORK mode --
    # The controller ACTIVATES IN REST: it ramps to default_joint_positions
    # over rest_ramp_s and holds there, skipping image processing and ONNX
    # inference entirely. Policy control starts only after:
    #   ros2 service call /volcaniarm_rl_vision_controller/set_work_mode \
    #     std_srvs/srv/SetBool "{data: true}"
    # and "{data: false}" ramps back home. Every (re)activation resets the
    # mode to start_in_work_mode — a service call made before activation
    # does not carry over. The current mode is latched on ~/work_mode
    # (std_msgs/Bool).
    start_in_work_mode: false

    # Seconds to ramp from the current pose to home when entering REST
    # (including a mid-reach WORK->REST switch). 0.0 = command home
    # instantly.
    rest_ramp_s: 1.0
