# Vision RL controller config — sibling of `volcaniarm_rl_controller.yaml`.
# Loaded into controller_manager so the operator can switch between
# the state-based and image-based policies at runtime.

controller_manager:
  ros__parameters:
    volcaniarm_rl_vision_controller:
      type: volcaniarm_controller/RLVisionPolicyController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


volcaniarm_rl_vision_controller:
  ros__parameters:
    # Same training contract as the state-based controller — joint
    # order matters for both obs and action vectors.
    joints:
      - volcaniarm_left_elbow_joint
      - volcaniarm_right_elbow_joint

    # Match Isaac Lab `init_state.joint_pos`.
    default_joint_positions: [0.0, 0.0]

    # Match training's JointPositionActionCfg(scale=0.5).
    action_scale: 0.5

    # Bundled ONNX (image + joint_pos_rel + last_action → action),
    # exported by source/volcaniarm/scripts/rsl_rl/export_onnx_bundle.py.
    model_path: "$(find-pkg-share volcaniarm_controllers)/models/policy_vision.onnx"

    # Camera image topic. Default matches both Gazebo's bridged
    # `/camera/color/image_raw` and the IsaacSim ROS2 USD's
    # `camera/color/image_raw` (CAM_RGB_TOPIC in scripts/add_ros2_graph.py).
    image_topic: /camera/color/image_raw

    # Resolution the bundled ONNX expects — must match
    # IMG_W/IMG_H in reach_vision_env_cfg.py. The controller resizes
    # the raw camera frame to (image_width × image_height) before
    # inference, so this stays fixed even if the camera publishes a
    # different native resolution.
    image_width: 96
    image_height: 96

    # -- Safety / polish (carried over from RLPolicyController) --
    # rclcpp on Jazzy treats explicit empty arrays as "no value set",
    # which the controller's get_parameter().as_double_array() call
    # then throws on. The controller's auto_declare already provides
    # an empty default that disables clamping; leave both out of
    # YAML to keep clamping off, or specify real arrays (one entry
    # per joint) to enforce mechanical / safety limits independent
    # of what the policy outputs. Recommended on real hardware.
    # Order matches `joints` above: [left_elbow, right_elbow].
    #
    # MUST NOT be tighter than the range the policy was trained in, or the
    # controller silently refuses valid actions and the arm cannot reach
    # targets it was trained to reach. Training bounds the elbows at
    # +-1.3089969 rad via the `elbow_pos_in_range` reward term, and the
    # reachable-workspace numbers in scripts/check_workspace.py assume that.
    #
    # The previous +-1.0 cost roughly half the reachable Y span at canopy
    # height (y in [-0.219,+0.159] -> [-0.098,+0.108] in the 0.125-0.150 m
    # band), which showed up as the arm failing to reach weeds toward the
    # outer edges in Y.
    #
    # NOTE for real hardware: +-1.0 was originally chosen as a conservative
    # guard. This is still a safety clamp, just aligned to the trained
    # envelope — confirm the arm's true mechanical limits before running this
    # on the physical robot.
    joint_position_min: [-1.3089969, -1.3089969]
    joint_position_max: [1.3089969, 1.3089969]

    # EMA smoothing on raw policy outputs. 1.0 = no smoothing.
    # Lower values damp the high-frequency demands that exceed the
    # stepper's physical step rate (the sim-to-real gap that caused
    # the state-based policy to chase its own tail on first deploy).
    # 0.3 = 70% old / 30% new each tick.
    action_smoothing_alpha: 0.3

    # Stale-image watchdog. If the latest image stamp is older than
    # this many seconds the controller falls back to the home pose.
    # Skipped when stamp is zero (un-stamped publishers), same policy
    # as the state-based controller's stale-target watchdog.
    image_max_age_s: 1.0
